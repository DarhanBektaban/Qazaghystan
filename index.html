<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qazaghystan</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2.25rem;
      color: var(--accent);
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .status {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="status">Live & Ready</span>
    <h1 style="margin-top: 1rem;">www.qazaghystan.com</h1>
    <p>Welcome to the portal for Kazakh linguistic innovations, scripts, and digital tools.</p>
  </main>
</body>
</html>
